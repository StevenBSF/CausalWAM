# Strict paired-background collection for supported RoboTwin tasks.
#
# The runner overrides save_path, episode_num, need_plan, save_data, and the
# clean/style value of random_background.  Every other randomization setting
# is intentionally pinned here and checked again by the runner.
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment:
  - aloha-agilex
language_num: 0
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 0
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
  random_embodiment: false
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  true_qpos: true
  true_qvel: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
# The transactional runner overrides this with data/<task>/paired_random_background.
save_path: ./data/grab_roller/paired_random_background
clear_cache_freq: 1
collect_data: true
eval_video_log: false
